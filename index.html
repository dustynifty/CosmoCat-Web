<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Unity Web Player | Cosmo Cat</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #231F20;
      }

      #unity-canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        border: 0;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas
      id="unity-canvas"
      width=1920
      height=1080
      tabindex="-1"
      style="background: #231F20"></canvas>
    <script src="Build/Public Content_Web.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/Public Content_Web.data.unityweb",
        frameworkUrl: "Build/Public Content_Web.framework.js.unityweb",
        codeUrl: "Build/Public Content_Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DuftyNifty",
        productName: "Cosmo Cat",
        productVersion: "CosmoCat_Public Content",
        matchWebGLToCanvasSize: true,
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
